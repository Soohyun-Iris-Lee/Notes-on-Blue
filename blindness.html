<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blindness by Jorge Luis Borges</title>

  <link rel="stylesheet" href="https://use.typekit.net/yce2qid.css">
  <link rel="stylesheet" href="blindness.css">
</head>

<body>
  <div class="wrapper">
    <!-- 제목 -->
    <div class="content single-line">
      <h1>Lecture on Blindness <span class="author">by Jorge Luis Borges</span></h1>
    </div>

    <!-- 비디오 -->
    <div class="video-container">
      <video controls preload="metadata" poster="thumbnail.jpg">
        <source src="blindness.mp4" type="video/mp4" />
      </video>
    </div>

    <!-- ✅ 오른쪽 하단 심볼 하나만 (index.html로 이동) -->
    <a class="corner br corner-link" href="index.html" aria-label="Back to index (Notes on Blue)" title="Back to index">
      <span class="sq"></span>
      <span class="sq"></span>
      <span class="sq"></span>
      <span class="sq"></span>
      <span class="sq"></span>
    </a>
  </div>
   <audio id="autoplayAudio" preload="auto" loop>
      <source src="lectureonblindness.mp3" type="audio/mp3" />
      Your browser does not support the audio tag.
    </audio>
    <script>
    const audio = document.getElementById('autoplayAudio');
    const overlay = document.getElementById('playOverlay');
    const playBtn = document.getElementById('playBtn');

    function hideOverlay(){ overlay.style.display = 'none'; }
    function showOverlay(){ overlay.style.display = 'flex'; }

    async function tryPlay(){
      try {
        await audio.play();
        hideOverlay();
      } catch (e) {
        // 브라우저 정책으로 차단된 경우
        showOverlay();
      }
    }

    // 1) 페이지 로드 시도
    window.addEventListener('load', tryPlay);

    // 2) 사용자 제스처가 있으면 즉시 재시도 (한 번만)
    ['click','touchstart','keydown'].forEach(evt => {
      document.addEventListener(evt, tryPlay, { once: true });
    });

    // 3) 오버레이 버튼으로 수동 재생
    playBtn.addEventListener('click', tryPlay);

    // 4) 탭 전환 후 돌아왔을 때 재시도
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && audio.paused) tryPlay();
    });
  </script>
</body>
</html>
